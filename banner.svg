<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f2c"/>
      <stop offset="60%" stop-color="#10215a"/>
      <stop offset="100%" stop-color="#0a0f2c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b8860b"/>
      <stop offset="50%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd700" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffd700" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grille" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M25 0H0V25" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <style>
      .reseau line { stroke:#a8c4e8; stroke-opacity:.14; stroke-width:1 }
      .flux { stroke:#ffd700; stroke-opacity:.85; stroke-width:1.8; stroke-dasharray:6 8; animation:file 2.4s linear infinite }
      @keyframes file { to { stroke-dashoffset:-28 } }
      @media (prefers-reduced-motion: reduce) { .flux { animation:none } }
    </style>
  </defs>

  <rect width="1000" height="250" rx="14" fill="url(#bg)"/>
  <rect width="1000" height="250" rx="14" fill="url(#grille)"/>

  <!-- Barre dorée verticale -->
  <rect x="64" y="58" width="4" height="134" rx="2" fill="url(#gold)"/>

  <!-- Identité -->
  <text x="92" y="104" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="bold" letter-spacing="1.5" fill="url(#gold)">Japhet KOYAKOSSO-ESSO</text>
  <text x="94" y="140" font-family="Georgia, 'Times New Roman', serif" font-size="17" letter-spacing="0.8" fill="#a8c4e8">L3 MIASHS parcours Informatique · Université Toulouse Jean Jaurès</text>
  <text x="94" y="176" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-style="italic" fill="#ffd700">Data · Intelligence artificielle · Développement</text>

  <!-- Réseau de neurones : des données vers l'IA -->
  <g class="reseau"><line x1="690" y1="62" x2="790" y2="48"/><line x1="690" y1="62" x2="790" y2="86"/><line x1="690" y1="62" x2="790" y2="124"/><line x1="690" y1="62" x2="790" y2="162"/><line x1="690" y1="62" x2="790" y2="200"/><line x1="690" y1="104" x2="790" y2="48"/><line x1="690" y1="104" x2="790" y2="86"/><line x1="690" y1="104" x2="790" y2="124"/><line x1="690" y1="104" x2="790" y2="162"/><line x1="690" y1="104" x2="790" y2="200"/><line x1="690" y1="146" x2="790" y2="48"/><line x1="690" y1="146" x2="790" y2="86"/><line x1="690" y1="146" x2="790" y2="124"/><line x1="690" y1="146" x2="790" y2="162"/><line x1="690" y1="146" x2="790" y2="200"/><line x1="690" y1="188" x2="790" y2="48"/><line x1="690" y1="188" x2="790" y2="86"/><line x1="690" y1="188" x2="790" y2="124"/><line x1="690" y1="188" x2="790" y2="162"/><line x1="690" y1="188" x2="790" y2="200"/><line x1="790" y1="48" x2="890" y2="96"/><line x1="790" y1="48" x2="890" y2="152"/><line x1="790" y1="86" x2="890" y2="96"/><line x1="790" y1="86" x2="890" y2="152"/><line x1="790" y1="124" x2="890" y2="96"/><line x1="790" y1="124" x2="890" y2="152"/><line x1="790" y1="162" x2="890" y2="96"/><line x1="790" y1="162" x2="890" y2="152"/><line x1="790" y1="200" x2="890" y2="96"/><line x1="790" y1="200" x2="890" y2="152"/></g>
  <g><line class="flux" x1="690" y1="104" x2="790" y2="86"/><line class="flux" x1="790" y1="86" x2="890" y2="96"/><line class="flux" x1="690" y1="146" x2="790" y2="162"/><line class="flux" x1="790" y1="162" x2="890" y2="152"/></g>
  <circle cx="690" cy="62" r="6" fill="#0a0f2c" stroke="#a8c4e8" stroke-width="1.6"/><circle cx="690" cy="104" r="6" fill="#0a0f2c" stroke="#a8c4e8" stroke-width="1.6"/><circle cx="690" cy="146" r="6" fill="#0a0f2c" stroke="#a8c4e8" stroke-width="1.6"/><circle cx="690" cy="188" r="6" fill="#0a0f2c" stroke="#a8c4e8" stroke-width="1.6"/>
  <circle cx="790" cy="48" r="6" fill="#0a0f2c" stroke="#ffd700" stroke-width="1.6"/><circle cx="790" cy="86" r="6" fill="#0a0f2c" stroke="#ffd700" stroke-width="1.6"/><circle cx="790" cy="124" r="6" fill="#0a0f2c" stroke="#ffd700" stroke-width="1.6"/><circle cx="790" cy="162" r="6" fill="#0a0f2c" stroke="#ffd700" stroke-width="1.6"/><circle cx="790" cy="200" r="6" fill="#0a0f2c" stroke="#ffd700" stroke-width="1.6"/>
  <circle cx="890" cy="96" r="18" fill="url(#halo)"><animate attributeName="r" values="11;19;11" dur="2.8s" repeatCount="indefinite"/></circle>
  <circle cx="890" cy="152" r="18" fill="url(#halo)"><animate attributeName="r" values="19;11;19" dur="2.8s" repeatCount="indefinite"/></circle>
  <circle cx="890" cy="96" r="7" fill="#ffd700" stroke="#ffd700" stroke-width="1.6"/><circle cx="890" cy="152" r="7" fill="#ffd700" stroke="#ffd700" stroke-width="1.6"/>
</svg>
